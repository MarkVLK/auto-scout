services:
  companion-runtime:
    build:
      context: ..
      dockerfile: container/Dockerfile
    container_name: auto-scout-melodic
    # DDS-style discovery is not part of the supported v1 path here, but host
    # networking still keeps the ROS graph boundary simple and avoids hidden
    # container-network assumptions during Scout bring-up.
    network_mode: host
    privileged: true
    working_dir: /opt/catkin_ws/src/auto-scout
    volumes:
      - "..:/opt/catkin_ws/src/auto-scout"
      - "${AUTO_SCOUT_STORAGE_ROOT:-/srv/auto-scout}:/srv/auto-scout"
      - "/run/avahi-daemon/socket:/run/avahi-daemon/socket"
      - "/run/dbus/system_bus_socket:/run/dbus/system_bus_socket"
      - "/dev:/dev"
    environment:
      AUTO_SCOUT_CONFIG: /opt/catkin_ws/src/auto-scout/config/scout_config.yaml
      AUTO_SCOUT_SITE_CONFIG: ${AUTO_SCOUT_SITE_CONFIG}
      AUTO_SCOUT_ODOM_MODEL_TYPE: ${AUTO_SCOUT_ODOM_MODEL_TYPE:-diff}
      AUTO_SCOUT_ENABLE_NAV_STACK: ${AUTO_SCOUT_ENABLE_NAV_STACK:-false}
      ROS_LOG_DIR: ${AUTO_SCOUT_ROS_LOG_DIR:-/srv/auto-scout/ros-logs}
      # The supported v1 path treats the companion container as the autonomy
      # boundary. Do not replace this with a ros1_bridge/Jazzy boundary unless
      # the documented architecture is intentionally being changed.
      ROS_MASTER_URI: ${AUTO_SCOUT_ROS_MASTER_URI}
      ROS_HOSTNAME: ${AUTO_SCOUT_ROS_HOSTNAME:-}
      ROS_IP: ${AUTO_SCOUT_ROS_IP:-}
    command:
      - /bin/bash
      - -lc
      - >
        if [ -z "$${ROS_HOSTNAME:-}" ]; then unset ROS_HOSTNAME; fi &&
        if [ -z "$${ROS_IP:-}" ]; then unset ROS_IP; fi &&
        source /opt/ros/melodic/setup.bash &&
        cd /opt/catkin_ws &&
        catkin_make &&
        source /opt/catkin_ws/devel/setup.bash &&
        roslaunch auto-scout companion_runtime.launch
        config_file:=/opt/catkin_ws/src/auto-scout/config/scout_config.yaml
        site_file:=${AUTO_SCOUT_SITE_CONFIG}
        localization_mode:=${AUTO_SCOUT_LOCALIZATION_MODE:-false}
        enable_nav_stack:=${AUTO_SCOUT_ENABLE_NAV_STACK:-false}
