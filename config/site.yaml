project:
  name: "auto-scout"
  artifact_root: "artifacts/runs"

roles:
  scout:
    hostname: "moorebot-scout"
    workspace_dir: "/userdata/catkin_ws/src/auto-scout"
    ssh:
      host: "scout-host-or-ip.invalid"
      user: "linaro"
      port: 22
      auth:
        mode: "agent"
        key_path: ""
    service_user: "linaro"
    service_group: "linaro"
    ros:
      distro: "melodic"
      master_uri: "http://scout-host-or-ip.invalid:11311"
      advertise_host: "scout-host-or-ip.invalid"
    devices:
      camera: "/dev/video0"
      lidar: "/dev/ttyS4"
    topics:
      camera_compressed: "/camera/image_raw/compressed"
      lidar_scan: "/scan"
      odom: "/MotorNode/baselink_odom_relative"
      vendor_cmd_vel: "/cmd_vel_force"
      planner_cmd_vel: "/scout/cmd_vel_planner"
      autonomy_cmd_vel: "/scout/cmd_vel_companion"
      safety_state: "/scout/safety_state"
      battery_status: "/SensorNode/simple_battery_status"
      battery_guard_state: "/scout/battery_guard_state"
      battery_guard_control: "/scout/battery_guard_control"
      vendor_dock_status: "/CoreNode/going_home_status"
      runtime_request: "/scout/runtime/request"
      scout_tof: "/SensorNode/tof"
      tof_range: "/scout/tof"
      scout_imu: "/SensorNode/imu"
      imu_data: "/scout/imu/data"
      vendor_dog_detection: "/scout/dog_detection_external"
    motion:
      forward_axis: "y"
      drive_model: "diff"
    adapters:
      motion: "rollereye_or_vendor_bridge"
      camera: "opencv_device"
      lidar: "ld19_serial"
      dock: "vendor_dock"
      dog_detection: "external_event"
    capabilities:
      camera: true
      scan: true
      tof: true
      imu: true
      pose: true
      motion: true
      dock: false
      notify: false
      vendor_bridge: true
    storage:
      media_cache_dir: "/var/tmp/auto-scout/scout_media_cache"
      map_cache_dir: "/var/tmp/auto-scout/scout_map_cache"

  companion:
    hostname: "auto-scout-pi5"
    workspace_dir: "/home/ubuntu/auto-scout"
    ssh:
      host: "companion-host-or-ip.invalid"
      user: "ubuntu"
      port: 22
      auth:
        mode: "agent"
        key_path: ""
    service_user: "ubuntu"
    service_group: "ubuntu"
    host_os:
      name: "ubuntu"
      version: "24.04"
      arch: "arm64"
    ros:
      containerized: true
      distro: "melodic"
      container_name: "auto-scout-melodic"
      compose_file: "container/docker-compose.yml"
      master_uri: "http://scout-host-or-ip.invalid:11311"
      advertise_host: "companion-host-or-ip.invalid"
    capabilities:
      camera: false
      scan: true
      pose: false
      dock: false
      notify: false
    storage:
      maps_dir: "/srv/auto-scout/maps"
      media_dir: "/srv/auto-scout/media"
      events_dir: "/srv/auto-scout/events"
    notifications:
      webhook_url: ""
