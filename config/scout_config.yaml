# Auto-Scout runtime configuration
#
# This file now models the verified companion-first architecture:
# - Scout stays lightweight and handles motion, capture, and sensor bridging
# - Companion handles SLAM, navigation, storage, and reporting

platform:
  runtime_profile: "scout_with_companion"
  scout_control_api: "rollereye_or_vendor_bridge"
  recommended_companion_ros: "melodic"
  fallback_companion_ros: "kinetic"
  run_navigation_on_companion: true
  run_heavy_ml_on_companion: true

storage:
  # Official Moorebot sources disagree on raw flash size and the FAQ says only
  # roughly 2 to 3 GB is user-accessible, so treat Scout storage as temporary.
  scout_media_cache_dir: "/var/tmp/auto-scout/scout_media_cache"
  scout_map_cache_dir: "/var/tmp/auto-scout/scout_map_cache"
  primary_store: "companion"
  companion_map_dir: "/srv/auto-scout/maps"
  companion_media_dir: "/srv/auto-scout/media"
  companion_event_dir: "/srv/auto-scout/events"
  webhook_url: ""

topics:
  lidar_scan: "/scan"
  camera_compressed: "/camera/image_raw/compressed"
  odom: "/MotorNode/baselink_odom_relative"
  vendor_cmd_vel: "/cmd_vel_force"
  planner_cmd_vel: "/scout/cmd_vel_planner"
  autonomy_cmd_vel: "/scout/cmd_vel_companion"
  safety_state: "/scout/safety_state"
  battery_status: "/SensorNode/simple_battery_status"
  battery_guard_state: "/scout/battery_guard_state"
  battery_guard_control: "/scout/battery_guard_control"
  vendor_dock_status: "/CoreNode/going_home_status"
  runtime_request: "/scout/runtime/request"
  scout_video_stream: "/CoreNode/h264"
  scout_imu: "/SensorNode/imu"
  imu_data: "/scout/imu/data"
  scout_tof: "/SensorNode/tof"
  tof_range: "/scout/tof"
  vendor_dog_detection: "/scout/dog_detection_external"
  external_dog_detection: "/scout/dog_detection_external"

waypoints:
  home:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
  kitchen:
    x: 3.0
    y: 1.0
    z: 0.0
    w: 1.0
  living_room:
    x: 2.0
    y: -2.0
    z: 0.0
    w: 1.0
  bedroom:
    x: -2.0
    y: 2.0
    z: 0.0
    w: 1.0
  office:
    x: -3.0
    y: -1.0
    z: 0.0
    w: 1.0
  bathroom:
    x: 1.0
    y: 3.0
    z: 0.0
    w: 1.0
  hallway:
    x: 0.0
    y: 1.0
    z: 0.0
    w: 1.0
  charging_station:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0

schedules:
  - name: morning_patrol
    time: "08:00"
    waypoints: [kitchen, living_room, hallway, home]
    active: false
  - name: evening_patrol
    time: "20:00"
    waypoints: [living_room, bedroom, office, home]
    active: false

safety:
  battery_guard_enabled: true
  min_battery_level: 20.0
  critical_battery_level: 10.0
  battery_reset_margin: 5.0
  map_return_claim_timeout_seconds: 5.0
  map_return_timeout_seconds: 180.0
  dock_timeout_seconds: 180.0
  dock_retry_count: 1
  max_obstacle_distance: 0.3
  emergency_stop_distance: 0.15
  tof_stop_enabled: true
  require_tof: false
  tof_stale_timeout: 1.0
  scan_watchdog_enabled: true
  scan_stale_timeout: 1.0
  caution_speed: 0.05

lidar:
  port: "/dev/ttyS4"
  baudrate: 230400
  frame_id: "base_laser"
  range_min: 0.02
  range_max: 12.0
  angle_min: 0.0
  angle_max: 6.28318
  invert_scan: false

camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 15
  frame_id: "camera_link"

web:
  port: 8080

navigation:
  execution_host: "companion"
  slam_package: "gmapping"
  localization_package: "amcl"
  planner_package: "move_base"
  exploration_package: "explore_lite"
  max_vel_x: 0.25
  max_vel_theta: 0.8
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  planner_frequency: 1.0
  controller_frequency: 10.0
  dock_approach_waypoint: "charging_station"
  dock_approach_timeout_seconds: 180.0
  pose_stale_timeout: 3.0

mapping:
  map_resolution: 0.05
  map_update_interval: 5.0
  particles: 80
  linear_update: 0.1
  angular_update: 0.0436
  save_directory: "/srv/auto-scout/maps"

dog_search:
  max_search_time: 600
  room_search_time: 30
  detection_backend: "companion_detector"
  external_detection_topic: "/scout/dog_detection_external"
  preferred_backend_order:
    - "builtin_scout_ai"
    - "companion_detector"
  search_order:
    - living_room
    - kitchen
    - bedroom
    - office
    - bathroom
    - hallway
  capture_short_video: true
  result_storage: "companion"
