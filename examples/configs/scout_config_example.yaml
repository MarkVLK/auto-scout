# Example Scout Configuration File
# This is a sample configuration showing all available options

# Robot identification
robot:
  name: "scout-001"
  type: "moorebot_scout"
  firmware_version: "1.0"

# Navigation parameters
navigation:
  max_vel_x: 0.5          # Maximum linear velocity (m/s)
  max_vel_theta: 1.0      # Maximum angular velocity (rad/s)
  min_vel_x: 0.1          # Minimum linear velocity (m/s)
  min_vel_theta: 0.2      # Minimum angular velocity (rad/s)
  
  # Goal tolerance
  xy_goal_tolerance: 0.2   # Position tolerance (m)
  yaw_goal_tolerance: 0.1  # Orientation tolerance (rad)
  
  # Obstacle avoidance
  obstacle_range: 2.5      # Range for obstacle detection (m)
  raytrace_range: 3.0      # Range for raycasting (m)

# Lidar configuration
lidar:
  device: "/dev/ttyUSB0"
  baudrate: 230400
  frame_id: "laser_frame"
  scan_frequency: 10       # Hz
  angle_min: -3.14159      # radians
  angle_max: 3.14159       # radians
  range_min: 0.15          # meters
  range_max: 12.0          # meters

# Camera configuration  
camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  frame_id: "camera_frame"

# Dog search parameters
dog_search:
  max_search_time: 600     # Total search time limit (seconds)
  room_search_time: 30     # Time to spend in each room (seconds)
  detection_confidence: 0.7 # Minimum confidence for dog detection
  photo_quality: 85        # JPEG quality for photos (0-100)
  
  # Room search order
  search_order:
    - "living_room"
    - "kitchen" 
    - "bedroom"
    - "office"
    - "bathroom"
    - "hallway"
  
  # Photo upload settings
  photo_upload:
    enabled: true
    service: "local"       # Options: local, cloud
    local_path: "~/scout_photos"
    webhook_url: ""        # Optional webhook for notifications

# House layout (waypoints in map coordinates)
house_layout:
  rooms:
    living_room:
      center: {x: 2.0, y: -2.0}
      bounds: {x_min: 1.0, x_max: 3.0, y_min: -3.0, y_max: -1.0}
      waypoints:
        - {x: 1.5, y: -1.5}
        - {x: 2.5, y: -2.5}
    
    kitchen:
      center: {x: 3.5, y: 1.5}
      bounds: {x_min: 2.5, x_max: 4.5, y_min: 0.5, y_max: 2.5}
      waypoints:
        - {x: 3.0, y: 1.0}
        - {x: 4.0, y: 2.0}
    
    bedroom:
      center: {x: -2.0, y: 2.0}
      bounds: {x_min: -3.0, x_max: -1.0, y_min: 1.0, y_max: 3.0}
      waypoints:
        - {x: -2.5, y: 1.5}
        - {x: -1.5, y: 2.5}
    
    office:
      center: {x: -2.0, y: -2.0}
      bounds: {x_min: -3.0, x_max: -1.0, y_min: -3.0, y_max: -1.0}
      waypoints:
        - {x: -2.5, y: -1.5}
        - {x: -1.5, y: -2.5}
    
    bathroom:
      center: {x: -1.0, y: -1.0}
      bounds: {x_min: -2.0, x_max: 0.0, y_min: -2.0, y_max: 0.0}
      waypoints:
        - {x: -1.5, y: -0.5}
    
    hallway:
      center: {x: 0.0, y: 0.0}
      bounds: {x_min: -1.0, x_max: 1.0, y_min: -1.0, y_max: 1.0}
      waypoints:
        - {x: 0.0, y: 0.5}
        - {x: 0.0, y: -0.5}
  
  # Charging dock location
  charging_dock: {x: 0.0, y: 0.0, theta: 0.0}

# Voice command configuration
voice_commands:
  enabled: true
  language: "en-US"
  confidence_threshold: 0.7
  
  # Custom command mappings
  commands:
    "find my dog": "find_dog"
    "search for dog": "find_dog" 
    "stop searching": "stop_dog_search"
    "go home": "go_charging_dock"
    "start patrol": "start_patrol"
    "stop patrol": "stop_patrol"

# Safety parameters
safety:
  emergency_stop_enabled: true
  low_battery_threshold: 20    # Percentage
  max_operation_time: 7200     # Seconds (2 hours)
  collision_detection: true
  cliff_detection: true

# Logging configuration
logging:
  level: "INFO"               # DEBUG, INFO, WARN, ERROR
  log_to_file: true
  log_file: "/var/log/scout/scout.log"
  max_log_size: "10MB"
  backup_count: 5

# Network configuration
network:
  web_interface_port: 8080
  ros_master_uri: "http://localhost:11311"
  
# Scheduling (optional patrol schedules)
schedules:
  morning_patrol:
    enabled: false
    time: "08:00"
    route: ["living_room", "kitchen", "hallway"]
    
  evening_patrol:
    enabled: false  
    time: "18:00"
    route: ["bedroom", "office", "bathroom"]
